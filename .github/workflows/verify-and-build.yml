name: Verify and Build
run-name: Verify and Build - ${{ github.ref_name }}

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:

# Cancel any existing runs if new code is pushed to avoid multiple simultaneous instances
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  appId: 1620226  # Replace with your GitHub App ID

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log GitHub Context Information
        shell: bash
        run: |
          echo "=== GitHub Context ==="
          echo '${{ toJSON(github) }}'
          echo ""
          echo "=== Job Context ==="
          echo '${{ toJSON(job) }}'
          echo ""
          echo "=== Steps Context ==="
          echo '${{ toJSON(steps) }}'
          echo ""
          echo "=== Runner Context ==="
          echo '${{ toJSON(runner) }}'
          echo ""
          echo "=== Strategy Context ==="
          echo '${{ toJSON(strategy) }}'
          echo ""
          echo "=== Matrix Context ==="
          echo '${{ toJSON(matrix) }}'
          echo ""
          echo "=== Secrets Context ==="
          echo "Secrets are masked and cannot be displayed"
          echo ""
          echo "=== Vars Context ==="
          echo '${{ toJSON(vars) }}'
          echo ""
          echo "=== Env Context ==="
          echo '${{ toJSON(env) }}'

      - name: Build
        shell: bash
        env:
          CONTENT: ${{ github.ref }}
        run: |
          echo "$CONTENT - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > build.txt
          echo "Build succeeded."

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          # required
          app-id: ${{ env.appId }}
          private-key: ${{ secrets.RUDFOSS_RR_READER_PRIVATE_KEY }}
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Commit and Push Changes
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}"
          echo "user.name:     $(git config get --global user.name)"
          echo "user.email:    $(git config get --global user.email)"
          echo "remote.url:    $(git config get remote.origin.url)"
          git add .
          git commit -m "Auto-generated changes" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
          