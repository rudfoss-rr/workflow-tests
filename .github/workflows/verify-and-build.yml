name: Verify and Build
run-name: Verify and Build - ${{ github.ref_name }}

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:

# Cancel any existing runs if new code is pushed to avoid multiple simultaneous instances
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Log GitHub Context Information
        shell: bash
        run: |
          echo "=== GitHub Context ==="
          echo '${{ toJSON(github) }}'
          echo ""
          echo "=== Job Context ==="
          echo '${{ toJSON(job) }}'
          echo ""
          echo "=== Steps Context ==="
          echo '${{ toJSON(steps) }}'
          echo ""
          echo "=== Runner Context ==="
          echo '${{ toJSON(runner) }}'
          echo ""
          echo "=== Strategy Context ==="
          echo '${{ toJSON(strategy) }}'
          echo ""
          echo "=== Matrix Context ==="
          echo '${{ toJSON(matrix) }}'
          echo ""
          echo "=== Secrets Context ==="
          echo "Secrets are masked and cannot be displayed"
          echo ""
          echo "=== Vars Context ==="
          echo '${{ toJSON(vars) }}'
          echo ""
          echo "=== Env Context ==="
          echo '${{ toJSON(env) }}'

      - name: Build
        shell: bash
        env:
          CONTENT: ${{ github.ref }}
        run: |
          mkdir -p packed
          echo "$CONTENT - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > packed/build1.txt
          echo "$CONTENT - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > packed/build2.txt
          echo "$CONTENT - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > packed/build3.txt
          echo "Build succeeded."
      
      - name: Publish artifacts
        run: |
          for file in packed/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "::notice::Uploading $filename"
            # Use the upload-artifact action via npx
            npx @actions/artifact upload "$filename" "$file"
          done