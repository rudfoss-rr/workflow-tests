name: Verify and Build
run-name: Verify and Build - ${{ github.ref_name }}

permissions:
  contents: read
  pull-requests: write
  actions: read

on:
  workflow_dispatch:

# Cancel any existing runs if new code is pushed to avoid multiple simultaneous instances
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-latest
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Log GitHub Context Information
        shell: bash
        run: |
          echo "=== GitHub Context ==="
          echo '${{ toJSON(github) }}'
          echo ""
          echo "=== Job Context ==="
          echo '${{ toJSON(job) }}'
          echo ""
          echo "=== Steps Context ==="
          echo '${{ toJSON(steps) }}'
          echo ""
          echo "=== Runner Context ==="
          echo '${{ toJSON(runner) }}'
          echo ""
          echo "=== Strategy Context ==="
          echo '${{ toJSON(strategy) }}'
          echo ""
          echo "=== Matrix Context ==="
          echo '${{ toJSON(matrix) }}'
          echo ""
          echo "=== Secrets Context ==="
          echo "Secrets are masked and cannot be displayed"
          echo ""
          echo "=== Vars Context ==="
          echo '${{ toJSON(vars) }}'
          echo ""
          echo "=== Env Context ==="
          echo '${{ toJSON(env) }}'

      - name: Build
        shell: bash
        env:
          CONTENT: ${{ github.ref }}
        run: |
          echo "$CONTENT - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > build.txt
          echo "Build succeeded."
          
      - name: Replace placeholder
        uses: ./updatePr
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          placeholder: addStuff
          content: "' | env"

      - name: Publish build artifact
        uses: actions/upload-artifact@v5
        with:
          name: packed
          path: build.txt
          retention-days: 3
          