name: Verify and Build
run-name: Verify and Build - ${{ github.ref_name }}

permissions:
  contents: read
  pull-requests: write
  actions: read

on:
  workflow_dispatch:

# Cancel any existing runs if new code is pushed to avoid multiple simultaneous instances
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-latest
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Log GitHub Context Information
        shell: bash
        run: |
          echo "=== GitHub Context ==="
          echo '${{ toJSON(github) }}'
          echo ""
          echo "=== Job Context ==="
          echo '${{ toJSON(job) }}'
          echo ""
          echo "=== Steps Context ==="
          echo '${{ toJSON(steps) }}'
          echo ""
          echo "=== Runner Context ==="
          echo '${{ toJSON(runner) }}'
          echo ""
          echo "=== Strategy Context ==="
          echo '${{ toJSON(strategy) }}'
          echo ""
          echo "=== Matrix Context ==="
          echo '${{ toJSON(matrix) }}'
          echo ""
          echo "=== Secrets Context ==="
          echo "Secrets are masked and cannot be displayed"
          echo ""
          echo "=== Vars Context ==="
          echo '${{ toJSON(vars) }}'
          echo ""
          echo "=== Env Context ==="
          echo '${{ toJSON(env) }}'

      - name: Build
        shell: bash
        env:
          CONTENT: ${{ github.ref }}
        run: |
          echo "$CONTENT - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > build.txt
          echo "Build succeeded."

      - name: Get PR number for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        id: getPr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Search for open PRs from the current branch
          PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            echo "No associated PR found"
            echo "prNumber=" >> $GITHUB_OUTPUT
          else
            echo "Found assocuated PR: $PR_NUMBER"
            echo "prNumber=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Add timestamp to PR placeholder
        if: steps.getPr.outputs.prNumber != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.getPr.outputs.prNumber }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Get current PR body
          currentBody=$(gh pr view $PR_NUMBER --json body -q .body)
          
          # Check if placeholder exists
          if echo "$currentBody" | grep -q "<!-- PLACEHOLDER addStuff -->"; then
            # Get current timestamp
            timestamp=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
            
            # Replace placeholder with timestamp
            newBody=$(echo "$template_content" | sed '/<!-- PLACEHOLDER:main -->/,/<!-- \/PLACEHOLDER:main -->/c\<!-- PLACEHOLDER:main -->${RUN_ID} - ${timestamp}<!-- /PLACEHOLDER:main -->')
            
            # Update PR description
            echo "Updating PR $PR_NUMBER description: $newBody"
            gh pr edit $PR_NUMBER --body "$newBody"
          fi

      - name: Publish build artifact
        uses: actions/upload-artifact@v5
        with:
          name: packed
          path: build.txt
          retention-days: 3
          