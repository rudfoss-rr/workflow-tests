name: Update PR description placeholder
description: Change the content of a placeholder in a PR description.
inputs:
  placeholder:
    description: The name of the placeholder to update.
    required: true
  content:
    description: The new content to insert in the placeholder.
    requestd: true
  githubToken:
    description: GitHub token to authenticate with the GitHub API.
    required: true
  prNumber:
    description: The pull request number to update. If not provided, the action will attempt to determine it from the branch.
    required: false

runs:
  using: "composite"
  steps:
    - name: Find PR number
      id: prNumber
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.githubToken }}
        INPUT_PR_NUMBER: ${{ inputs.prNumber }}
      run: |
        if [ -n "$INPUT_PR_NUMBER" ]; then
          echo "Using input PR#: $INPUT_PR_NUMBER"
          echo "prNumber=$INPUT_PR_NUMBER" >> $GITHUB_OUTPUT
          exit 0
        fi

        PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
        if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
          echo "No PR# found"
          echo "prNumber=" >> $GITHUB_OUTPUT
        else
          echo "Found PR#: $PR_NUMBER"
          echo "prNumber=$PR_NUMBER" >> $GITHUB_OUTPUT
        fi
    
    - name: Update PR description
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.githubToken }}
        PR_NUMBER: ${{ steps.prNumber.outputs.prNumber }}
        PLACEHOLDER: ${{ inputs.placeholder }}
        CONTENT: ${{ inputs.content }}
      run: |
        # Validate placeholder format
        if ! echo "$PLACEHOLDER" | grep -qE '^[a-zA-Z0-9]{1,32}$'; then
          echo "Error: placeholder must match regex ^[a-z0-9]{1,32}$" >&2
          exit 1
        fi

        # Get current PR body
        currentBody=$(gh pr view "$PR_NUMBER" --json body -q .body)
        echo "Current body: $currentBody"
        
        # Prepare new content with placeholder tags
        newContent="<!-- PLACEHOLDER:$PLACEHOLDER -->$CONTENT<!-- /PLACEHOLDER:$PLACEHOLDER -->"
        
        # Replace placeholder with timestamp
        newBody=$(echo "$currentBody" | sed '/<!-- PLACEHOLDER:$PLACEHOLDER -->/,/<!-- \/PLACEHOLDER:$PLACEHOLDER -->/c\$newContent')
        
        # Only update if the body has changed
        if [ "$currentBody" != "$newBody" ]; then
          echo "Updating PR $PR_NUMBER description"
          gh pr edit "$PR_NUMBER" --body "$newBody"
        fi